<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mine bonger</title>
  <link rel="stylesheet" href="guest.css">
</head>
<body>
  <main class="guest-shell">
    <section class="guest-intro">
      <p class="eyebrow">BongFlow</p>
      <div class="venue-visual" id="venueVisual" hidden><img id="venueImage" alt=""></div>
      <h1 id="venueTitle">Dine bonger</h1>
      <p id="venueDescription">Logg inn med telefon og fødselsår for å se dine bonger.</p>
    </section>

    <section class="panel" id="loginPanel">
      <form id="guestLoginForm">
        <label for="phone">Telefonnummer</label>
        <input id="phone" type="tel" value="+47 912 34 567" required>
        <label for="birthYear">Fødselsår</label>
        <input id="birthYear" inputmode="numeric" value="1994" required>
        <button type="submit">Logg inn</button>
        <p class="message" id="loginMessage"></p>
      </form>
    </section>

    <section class="panel account" id="accountPanel" hidden>
      <div class="account-top"><div><p class="eyebrow" id="eventName">Arrangement</p><h2 id="guestName">Gjest</h2></div><button class="link-button" id="logoutButton" type="button">Logg ut</button></div>
      <p id="locationName" class="muted"></p>
      <div class="bong-number" id="bongCount">0</div>
      <p class="bong-caption">bonger igjen</p>
      <div class="meter"><span id="bongMeter"></span></div>
      <div class="swipe-track" id="swipeTrack" aria-label="Sveip for å bruke en bong">
        <span class="swipe-hint">Dra for å bruke bong</span>
        <button class="swipe-handle" id="swipeButton" type="button" aria-label="Dra denne til høyre">&gt;&gt;</button>
      </div>
      <p class="message" id="swipeMessage"></p>
      <p class="muted" id="updatedAt">Oppdateres automatisk</p>
    </section>
  </main>
  <script src="guest.js"></script>
</body>
</html>
